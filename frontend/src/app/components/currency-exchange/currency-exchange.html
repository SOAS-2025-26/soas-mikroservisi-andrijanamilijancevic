<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-dark text-white">
        <h5>Currency Exchange</h5>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Od valute</label>
          <input type="text" class="form-control" [(ngModel)]="from" placeholder="npr. USD">
        </div>
        <div class="mb-3">
          <label class="form-label">Do valute</label>
          <input type="text" class="form-control" [(ngModel)]="to" placeholder="npr. EUR">
        </div>
        <button class="btn btn-dark w-100" (click)="getRate()">Dohvati kurs</button>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>

        <div *ngIf="result" class="alert alert-success mt-3">
          <p><strong>Od:</strong> {{ result.currencyFrom }}</p>
          <p><strong>Do:</strong> {{ result.currencyToCode }} ({{ result.currencyToName }})</p>
          <p><strong>Kurs:</strong> {{ result.rate }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
