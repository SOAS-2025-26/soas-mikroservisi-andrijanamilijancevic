spring.application.name=trade-service
server.port=8600

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.tradeService.sliding-window-size=10
resilience4j.circuitbreaker.instances.tradeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tradeService.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=10s